kind = "web"
previewPath = "/"
title = "WhyWays Technologies"
version = "1.0.0"
id = "artifacts/whyways"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23836

[services.development]
run = "pnpm --filter @workspace/whyways run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/whyways", "run", "build" ]
serve = "static"
publicDir = "artifacts/whyways/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23836"
BASE_PATH = "/"
